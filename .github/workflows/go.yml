# Minimal Go CI: build, vet, and test (-race) on every push/PR to the mainline.
# 真实 helper 集成测试在 CI 自动跳过 (缺 avalon-helper.jar / JDK 17 / 游戏数据).
name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Build
      run: go build ./...

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -race ./...

    # 插件事件目录三方一致性 (hub 代码 x HA-Contract openapi x
    # docs/plugins/EVENT-CATALOG.md 机器区块). 任一来源读不到/为空都硬失败,
    # 不允许"读不到所以跳过"的假绿. 脚本权威在 HA-Contract 仓.
    - name: Checkout HA-Contract
      uses: actions/checkout@v7
      with:
        repository: CoreMatch/HA-Contract
        path: HA-Contract

    - name: Plugin event drift check
      run: AVALON_REPO_DIR=$GITHUB_WORKSPACE bash HA-Contract/scripts/check-avalon-plugin-event-drift.sh
